services:
  mysql:
    image: mysql:8.4
    container_name: fruity-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-change-me}"
      MYSQL_DATABASE: "${DB_NAME:-logs_db}"
      MYSQL_USER: "${DB_USER:-fruity}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-change-me}"
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-change-me}"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: fruity-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: "${DB_USER:-fruity}"
      PMA_PASSWORD: "${DB_PASSWORD:-change-me}"
    ports:
      - "8082:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
